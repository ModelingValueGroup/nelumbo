<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nelumbo Component Overview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one 16:9 pond scene that grows a lotus step by step (heart petal, rhizome, petals,
     leaves), a caption in the free top-right corner of the scene, and a control bar below. */
  :root {
    --bg-0:        #0d0813;
    --bg-1:        #151024;
    --halo:        rgba(169, 154, 232, .09);
    --ink:         #eae5ee;
    --ink-dim:     #a89fb2;
    --lotus:       #c184d8;
    --lotus-soft:  #edd4e8;
    --line:        rgba(193, 132, 216, .28);
    --chip:        rgba(255, 255, 255, .06);
    --heart:       #edd4e8;
    --heart-ink:   #2a1033;
    --inner:       #b57fcf;
    --inner-ink:   #1c0b24;
    --outer:       #6a478c;
    --outer-ink:   #f6ecf8;
    --leaf:        #2f5a4a;
    --leaf-rim:    #6fb596;
    --leaf-ink:    #e3f4ec;
    --stalk:       #4c8a70;
    --water:       rgba(169, 154, 232, .10);
    --water-line:  rgba(193, 132, 216, .45);
    --mud:         #1f1430;
    --root:        #46335c;
    --root-core:   #5d407b;
    --root-line:   #a57fc0;
    --root-ink:    #f3e9f5;
    --glow:        rgba(237, 212, 232, .55);
    --dim:         saturate(.4) brightness(.78);
    --display:     "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
    --sans:        "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:        "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-0: #fbf7fb; --bg-1: #f3e9f5; --halo: rgba(154, 76, 184, .08);
      --ink: #2a1033; --ink-dim: #5e4a68; --lotus: #9a4cb8; --lotus-soft: #7a3a96;
      --line: rgba(154, 76, 184, .3); --chip: rgba(42, 16, 51, .07);
      --heart: #8a3fa8; --heart-ink: #ffffff; --inner: #c595da; --inner-ink: #2a1033;
      --outer: #dfc2e8; --outer-ink: #3a1747;
      --leaf: #cfe7da; --leaf-rim: #5f9e80; --leaf-ink: #143b2c; --stalk: #5f9e80;
      --water: rgba(111, 95, 196, .10); --water-line: rgba(154, 76, 184, .4); --mud: #e6d6ec;
      --root: #fbf3fc; --root-core: #edd9f3; --root-line: #b48ac6; --root-ink: #2a1033;
      --glow: rgba(154, 76, 184, .45); --dim: saturate(.35) brightness(1.08);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg-0: #fbf7fb; --bg-1: #f3e9f5; --halo: rgba(154, 76, 184, .08);
    --ink: #2a1033; --ink-dim: #5e4a68; --lotus: #9a4cb8; --lotus-soft: #7a3a96;
    --line: rgba(154, 76, 184, .3); --chip: rgba(42, 16, 51, .07);
    --heart: #8a3fa8; --heart-ink: #ffffff; --inner: #c595da; --inner-ink: #2a1033;
    --outer: #dfc2e8; --outer-ink: #3a1747;
    --leaf: #cfe7da; --leaf-rim: #5f9e80; --leaf-ink: #143b2c; --stalk: #5f9e80;
    --water: rgba(111, 95, 196, .10); --water-line: rgba(154, 76, 184, .4); --mud: #e6d6ec;
    --root: #fbf3fc; --root-core: #edd9f3; --root-line: #b48ac6; --root-ink: #2a1033;
    --glow: rgba(154, 76, 184, .45); --dim: saturate(.35) brightness(1.08);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg-0); color: var(--ink); font: 16px/1.5 var(--sans); }

  .deck { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .cell { container-type: size; min-height: 0; display: grid; place-items: center; padding-inline: 16px; padding-block: 12px 0; }
  .frame { position: relative; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; container-type: inline-size; }
  .scroll {
    position: absolute; inset: 0; overflow: hidden; border-radius: 14px;
    background:
      radial-gradient(60% 50% at 50% 40%, var(--halo), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 62%);
  }
  .scene { display: block; width: 100%; height: 100%; }

  /* ---------------- scene: shapes ---------------- */
  .mud { fill: var(--mud); }
  .water { fill: var(--water); }
  .waterline { stroke: var(--water-line); stroke-width: 1.5; fill: none; }
  .ripple {
    fill: none; stroke: var(--water-line); stroke-width: 1.5; opacity: 0;
    transform-box: fill-box; transform-origin: center; animation: ripple 7s linear infinite;
  }
  .ripple.r2 { animation-delay: 2.3s; }
  .ripple.r3 { animation-delay: 4.6s; }
  @keyframes ripple {
    0%   { transform: scale(.25); opacity: 0; }
    12%  { opacity: .8; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .seed { fill: var(--root-line); }

  .c { transition: filter .5s; }
  .c.on { cursor: pointer; }
  .c.cur { filter: drop-shadow(0 0 16px var(--glow)); }
  .frame:not(.full) .c.on:not(.cur):not(.rel) { filter: var(--dim); }

  .petal {
    opacity: 0; transform: rotate(0deg) scale(.06);
    transition: transform 1.1s cubic-bezier(.19, 1, .3, 1), opacity .4s, filter .5s;
  }
  .petal.on { opacity: 1; transform: rotate(var(--a)) scale(var(--s)); }
  .petal.heart.on { transition-delay: .35s; }
  .petal path { stroke: var(--bg-0); stroke-width: 5; stroke-linejoin: round; }
  .petal.heart path { fill: var(--heart); }
  .petal.inner path { fill: var(--inner); }
  .petal.outer path { fill: var(--outer); }

  .draw { fill: none; stroke: var(--stalk); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .9s ease, opacity .2s; }
  .draw.on { stroke-dashoffset: 0; opacity: 1; }
  .stem { stroke-width: 9; }
  .stalk { stroke-width: 5; }
  .tendril { stroke: var(--lotus-soft); stroke-width: 2.5; }
  .tendril.on { transition-delay: .9s; }
  .dot { fill: var(--lotus-soft); stroke: var(--bg-0); stroke-width: 2; opacity: 0; transition: opacity .3s; }
  .dot.on { opacity: 1; transition-delay: 1.6s; }

  .grow { transform: scale(.05); opacity: 0; transition: transform .8s cubic-bezier(.19, 1, .3, 1), opacity .3s; }
  .c.on .grow { transform: scale(1); opacity: 1; transition-delay: calc(.4s + var(--d, 0) * 90ms); }
  .leaf-body { fill: var(--leaf); stroke: var(--bg-0); stroke-width: 4; }
  .leaf-rim { fill: none; stroke: var(--leaf-rim); stroke-width: 1.5; opacity: .55; }
  .veins line { stroke: var(--leaf-rim); stroke-width: 1; opacity: .2; }
  .bud-outer { fill: var(--outer); stroke: var(--bg-0); stroke-width: 12; stroke-linejoin: round; }
  .bud-inner { fill: var(--inner); }

  .seg rect { fill: var(--root); stroke: var(--root-line); stroke-width: 2; }
  .seg.core rect { fill: var(--root-core); stroke: var(--lotus-soft); }
  .conn { fill: var(--root); stroke: var(--root-line); stroke-width: 2; }
  .hair { fill: none; stroke: var(--root-line); stroke-width: 2; stroke-linecap: round; opacity: .7; }
  .pebble rect { fill: none; stroke: var(--root-line); stroke-width: 1.5; stroke-dasharray: 4 4; }

  /* ---------------- scene: type ---------------- */
  .scene text { font-family: var(--sans); text-anchor: middle; }
  .lbl { opacity: 0; transition: opacity .4s; pointer-events: none; }
  .lbl.on { opacity: 1; transition-delay: .6s; }
  .t-name { font: 700 25px var(--display); letter-spacing: -.01em; }
  .t-sub { font: 500 12.5px var(--mono); opacity: .85; }
  .t-note { font: 500 14.5px var(--sans); opacity: .8; }
  .on-heart { fill: var(--heart-ink); }
  .on-inner { fill: var(--inner-ink); }
  .on-outer { fill: var(--outer-ink); }
  .leaf text { fill: var(--leaf-ink); }
  .t-leaf { font: 700 22px var(--display); letter-spacing: -.01em; }
  .t-leaf-sub { font: 500 13.5px var(--sans); opacity: .9; }
  .t-seg { font: 500 15px var(--mono); fill: var(--root-ink); }
  .t-pebble { font: 500 13px var(--mono); fill: var(--ink-dim); }
  .t-bud { font: 700 20px var(--display); fill: var(--ink); text-anchor: start !important; }
  .t-bud-sub { font: 500 13.5px var(--sans); fill: var(--ink-dim); text-anchor: start !important; }
  .brand .logo-body { fill: var(--lotus-soft); opacity: .16; }
  .brand .logo-line { fill: var(--lotus); }
  .t-brand { font: 700 15px var(--display); letter-spacing: .42em; fill: var(--lotus-soft); text-anchor: start !important; }

  /* ---------------- overlays ---------------- */
  .intro { position: absolute; left: 19%; width: 62%; top: 17%; text-align: center; font-size: 1.1cqw; animation: rise .9s cubic-bezier(.19, 1, .3, 1) both; }
  .eyebrow { margin: 0; font: 600 .82em/1.2 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--lotus); }
  .intro h1 { margin: .22em 0 .3em; font: 800 4.9em/1.02 var(--display); letter-spacing: -.03em; text-wrap: balance; }
  .intro .sub { margin: 0 auto; max-width: 30em; font-size: 1.3em; line-height: 1.5; color: var(--ink-dim); text-wrap: balance; }
  .intro .hint { margin: 1.6em 0 0; font-size: .95em; color: var(--ink-dim); }
  kbd { font: 500 .9em var(--mono); padding: .15em .5em; border: 1px solid var(--line); border-radius: 6px; background: var(--chip); color: var(--ink); }

  .caption { position: absolute; left: 68.6%; width: 28.8%; top: 5%; font-size: 1.1cqw; }
  .caption h2 { margin: .12em 0 .32em; font: 800 2.25em/1.05 var(--display); letter-spacing: -.025em; text-wrap: balance; }
  .caption .lead { margin: 0 0 .75em; line-height: 1.5; color: var(--ink); }
  .caption ul { margin: 0 0 .9em; padding: 0; list-style: none; display: grid; gap: .32em; color: var(--ink-dim); line-height: 1.4; }
  .caption li { padding-left: 1.15em; position: relative; }
  .caption li::before { content: ""; position: absolute; left: 0; top: .5em; width: .5em; height: .5em; border-radius: 50% 0; background: var(--lotus); transform: rotate(45deg); }
  .caption .meta { display: inline-block; margin: 0; font: 500 .8em/1.3 var(--mono); padding: .35em .7em; border-radius: 6px; background: var(--chip); color: var(--ink); overflow-wrap: anywhere; }
  .caption.in > * { animation: rise .55s cubic-bezier(.19, 1, .3, 1) both; }
  .caption.in > :nth-child(2) { animation-delay: .05s; }
  .caption.in > :nth-child(3) { animation-delay: .1s; }
  .caption.in > :nth-child(4) { animation-delay: .15s; }
  .caption.in > :nth-child(5) { animation-delay: .2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(.8em); } to { opacity: 1; transform: none; } }

  /* ---------------- control bar ---------------- */
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .rail { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .track { display: flex; gap: 2px; width: max-content; margin-inline: auto; }
  .chip-btn { font: 500 12.5px/1 var(--sans); padding: 7px 10px; border-radius: 999px; border: 0; background: none; color: var(--ink-dim); white-space: nowrap; cursor: pointer; opacity: .6; }
  .chip-btn.done { opacity: 1; }
  .chip-btn:hover { color: var(--ink); opacity: 1; }
  .chip-btn[aria-current="step"] { background: var(--lotus); color: var(--bg-0); font-weight: 600; opacity: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: 600 13.5px/1 var(--display); padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--lotus); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.icon { padding: 8px; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .count { font: 500 12.5px var(--mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: center; }
  button:focus-visible { outline: 2px solid var(--lotus-soft); outline-offset: 2px; }

  /* ---------------- phone: scene scrolls sideways, text stacks ---------------- */
  @media (max-width: 760px) {
    .deck { height: auto; display: block; }
    .cell { container-type: normal; display: block; padding-block: 12px; }
    .frame { width: 100%; aspect-ratio: auto; container-type: normal; display: grid; gap: 14px; }
    .scroll { position: static; overflow-x: auto; }
    .scene { width: 1100px; height: auto; aspect-ratio: 16 / 9; }
    .intro, .caption { position: static; width: auto; font-size: 1rem; text-align: left; }
    .intro h1 { font-size: 2.6em; }
    .intro .sub { font-size: 1.05em; margin: 0; }
    .intro { order: -1; }
    .bar { flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bg-0); }
    .rail { order: 5; flex-basis: 100%; }
    .track { margin-inline: 0; }
    .count { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01s !important; transition-delay: 0s !important; animation: none !important; }
    .ripple { opacity: .3; }
  }
</style>
</head>
<body>
<div class="deck">
  <div class="cell">
    <div class="frame intro-step" id="frame">
      <div class="scroll">
        <svg class="scene" id="scene" viewBox="0 0 1600 900" role="img" aria-label="A lotus plant built from the Nelumbo components: the knowledge base as the heart petal, the libraries as the rhizome, the CLI and the HTTP, LSP and MCP servers as petals, and the IDE plugins, the website and AI assistants as leaves.">
          <!-- under water: mud, libraries (rhizome), stalks -->
          <path class="mud" d="M0 748C200 738 400 756 620 746S1000 738 1200 750S1500 742 1600 748V900H0Z"/>
          <ellipse class="seed" cx="800" cy="794" rx="12" ry="9"/>

          <g class="c" data-step="libs">
            <g class="grow hairs" style="--d:4">
              <path class="hair" d="M425 829q-7 12 1 24"/><path class="hair" d="M575 829q7 12-1 24"/>
              <path class="hair" d="M1025 829q-7 12 1 24"/><path class="hair" d="M1175 829q7 12-1 24"/>
              <path class="hair" d="M775 831C770 842 745 846 735 857"/><path class="hair" d="M825 831C830 842 850 848 856 857"/>
            </g>
            <g transform="translate(705 872)"><g class="grow pebble" style="--d:6"><rect x="-48" y="-14" width="96" height="28" rx="14"/><text class="t-pebble" y="4.5">Java 21</text></g></g>
            <g transform="translate(862 872)"><g class="grow pebble" style="--d:6"><rect x="-95" y="-14" width="190" height="28" rx="14"/><text class="t-pebble" y="4.5">immutable-collections</text></g></g>
            <g class="grow" style="--d:1">
              <rect class="conn" x="416" y="796" width="18" height="18"/><rect class="conn" x="566" y="796" width="18" height="18"/>
              <rect class="conn" x="716" y="796" width="18" height="18"/><rect class="conn" x="866" y="796" width="18" height="18"/>
              <rect class="conn" x="1016" y="796" width="18" height="18"/><rect class="conn" x="1166" y="796" width="18" height="18"/>
            </g>
            <g transform="translate(350 805)"><g class="grow seg" style="--d:3"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">rationals</text></g></g>
            <g transform="translate(500 805)"><g class="grow seg" style="--d:2"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">integers</text></g></g>
            <g transform="translate(650 805)"><g class="grow seg core" style="--d:1"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">logic</text></g></g>
            <g transform="translate(800 805)"><g class="grow seg core" style="--d:0"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">lang</text></g></g>
            <g transform="translate(950 805)"><g class="grow seg" style="--d:1"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">strings</text></g></g>
            <g transform="translate(1100 805)"><g class="grow seg" style="--d:2"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">collections</text></g></g>
            <g transform="translate(1250 805)"><g class="grow seg" style="--d:3"><rect x="-70" y="-26" width="140" height="52" rx="26"/><text class="t-seg" y="5">datetime</text></g></g>
          </g>

          <path class="draw stalk" data-step="web" pathLength="1" d="M330 782C270 760 215 710 222 650C230 585 200 520 205 425"/>
          <path class="draw stalk" data-step="ide" pathLength="1" d="M385 782C330 765 265 705 260 650C257 620 252 590 250 560"/>
          <path class="draw stalk" data-step="mcp" pathLength="1" d="M1245 782C1320 765 1392 705 1386 650C1380 610 1372 570 1370 520"/>
          <path class="draw stalk" data-step="editor" pathLength="1" d="M1195 781C1190 740 1172 690 1175 640"/>
          <path class="draw stem" data-step="kb" pathLength="1" d="M800 783C792 740 808 690 800 620"/>

          <!-- water surface -->
          <rect class="water" x="0" y="650" width="1600" height="250"/>
          <path class="waterline" d="M0 650H1600"/>
          <ellipse class="ripple" cx="800" cy="650" rx="190" ry="15"/>
          <ellipse class="ripple r2" cx="800" cy="650" rx="190" ry="15"/>
          <ellipse class="ripple r3" cx="800" cy="650" rx="190" ry="15"/>

          <!-- leaves: who uses the servers -->
          <g class="c leaf" data-step="web" transform="translate(205 420)">
            <g class="grow">
              <ellipse class="leaf-body" rx="165" ry="54"/><g class="veins" data-rx="165" data-ry="54"></g><ellipse class="leaf-rim" rx="154" ry="46"/>

              <text class="t-leaf-sub" y="20">nelumbo.nl · tour · playground · docs</text>
            </g>
          </g>
          <g class="c leaf" data-step="ide" transform="translate(250 560)">
            <g class="grow">
              <ellipse class="leaf-body" rx="185" ry="56"/><g class="veins" data-rx="185" data-ry="56"></g><ellipse class="leaf-rim" rx="174" ry="48"/>
              <text class="t-leaf" y="-3">IDE plugins</text>
              <text class="t-leaf-sub" y="20">VS Code · IntelliJ · Eclipse · Neovim</text>
            </g>
          </g>
          <g class="c leaf" data-step="mcp" transform="translate(1370 520)">
            <g class="grow">
              <ellipse class="leaf-body" rx="150" ry="50"/><g class="veins" data-rx="150" data-ry="50"></g><ellipse class="leaf-rim" rx="139" ry="42"/>
              <text class="t-leaf" y="-3">AI assistants</text>

          </g>
          <g class="c" data-step="editor" transform="translate(1175 642)">
            <g class="grow">
              <path class="bud-outer" transform="scale(.3 .25)" d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/>
              <path class="bud-inner" transform="scale(.15 .22)" d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/>

              <text class="t-bud-sub" x="40" y="-24">standalone editor</text>
            </g>
          </g>

          <!-- the flower: knowledge base at the heart, one petal per way in -->
          <g transform="translate(800 620)">
            <g class="c petal outer" data-step="lsp" style="--a:-62deg;--s:.88"><path d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/></g>
            <g class="c petal outer" data-step="mcp" style="--a:62deg;--s:.88"><path d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/></g>
            <g class="c petal inner" data-step="http" style="--a:-31deg;--s:.96"><path d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/></g>
            <g class="c petal inner" data-step="cli" style="--a:31deg;--s:.96"><path d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/></g>
            <g class="c petal heart" data-step="kb" style="--a:0deg;--s:1"><path d="M0 0C-12-15-96-115-96-234C-96-362 0-465 0-465C0-465 96-362 96-234C96-115 12-15 0 0Z"/></g>
          </g>

          <g class="lbl on-heart" data-step="kb">
            <text class="t-name" x="800" y="322">Knowledge</text>
            <text class="t-name" x="800" y="350">base</text>
            <text class="t-note" x="800" y="392">types · syntax</text>
            <text class="t-note" x="800" y="414">facts · rules</text>
            <text class="t-note" x="800" y="436">queries</text>

      <div class="intro" id="intro">
        <p class="eyebrow">Component overview</p>
        <h1>Nelumbo, piece by piece</h1>
        <p class="sub">A knowledge base at the heart. Libraries at the root. Servers as petals. Editors as leaves.</p>
        <p class="hint"><kbd>&rarr;</kbd> or <kbd>Space</kbd> adds the next piece</p>
      </div>

      <div class="caption" id="caption" aria-live="polite" hidden>
        <p class="eyebrow" id="cap-kind"></p>
        <h2 id="cap-title"></h2>
        <p class="lead" id="cap-lead"></p>
        <ul id="cap-points"></ul>
        <p class="meta" id="cap-meta"></p>

  <div class="bar">
    <button class="btn" id="prev" type="button" title="Back (left arrow)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back</button>
    <nav class="rail" aria-label="Steps"><div class="track" id="track"></div></nav>
    <span class="count" id="count"></span>
    <button class="btn icon" id="theme" type="button" title="Switch light / dark (T)" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M12 7.5l6.6-1.6M12 12h8.5M12 16.5l6.6 1.6"/></svg></button>
    <button class="btn icon" id="full" type="button" title="Full screen (F)" aria-label="Toggle full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="btn" id="next" type="button" title="Next (right arrow or space)">Next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>

<script>
(function () {
  // One entry per step, in presentation order. `id` matches the data-step attributes in the scene.
  var STEPS = [
    { id: 'pond', nav: 'Pond' },
    { id: 'kb', nav: 'Knowledge base', kind: 'The heart', title: 'Knowledge base',
      lead: 'Everything you write in Nelumbo ends up here: types, syntax patterns, facts and rules. A query is answered by reasoning over them.',
      points: ['Tokenizer, parser and reasoner, written in Java', 'Three-valued answers: facts, falsehoods or unknown', 'A new construct is usable on the very next line'],
      meta: 'org.modelingvalue.nelumbo.KnowledgeBase' },
    { id: 'libs', nav: 'Libraries', kind: 'The roots', title: 'Libraries',
      lead: 'The language itself is a library. Seven modules written in Nelumbo define its syntax, its logic and its data types.',
      points: ['lang holds the grammar; logic adds facts, rules and queries', 'Only the irreducible primitives are native Java', 'Your own .nl modules are imported the same way'],
      meta: 'Java 21 · immutable-collections' },
    { id: 'cli', nav: 'CLI', kind: 'Petal', title: 'CLI',
      lead: 'Runs .nl files from a terminal, a script or a build, and checks every query against its expected result.',
      points: ['Exit code 0 on success; errors point to file:line:col', '--json for tools, -i for an interactive REPL', 'Double-click the jar for an evaluate window'],
      meta: 'java -jar nelumbo-cli-<version>.jar model.nl' },
    { id: 'http', nav: 'HTTP server', kind: 'Petal', title: 'HTTP server',
      lead: 'The same jar serves a knowledge base over REST, so any application can ask it questions.',
      points: ['/eval, /eval/trace, /metadata, /examples, /health', 'Every request gets a throwaway child knowledge base and a deadline', 'Runs on the HTTP server built into the JDK'],
      meta: 'nelumbo-cli-<version>.jar --server <port>' },
    { id: 'lsp', nav: 'LSP server', kind: 'Petal', title: 'LSP server',
      lead: 'Language intelligence for any editor that speaks the Language Server Protocol.',
      points: ['Diagnostics, completion, hover, go to definition', 'Semantic colouring, formatting, folding, code actions', 'Query results appear inline while you type', 'Over stdio or WebSocket, or embedded in another server'],
      meta: 'nelumbo-lsp-server-<version>.jar' },
    { id: 'ide', nav: 'IDE plugins', kind: 'Leaf', title: 'IDE plugins',
      lead: 'Thin plugins that start the LSP server and hand its answers to the IDE.',
      points: ['VS Code: TypeScript extension', 'IntelliJ IDEA: built on LSP4IJ', 'Eclipse: dropins plugin with format on save', 'Neovim: Lua plugin, work in progress'],
      meta: 'lsp/plugins/{vscode,intellij,eclipse,neovim}' },
    { id: 'web', nav: 'Web', kind: 'Leaf', title: 'Web',
      lead: 'nelumbo.nl puts the same servers behind a browser. Nothing to install.',
      points: ['Monaco editors talk to the LSP server over a WebSocket', 'A tour with self-checking exercises, a playground and the docs', 'REST endpoints come from the same eval service as the CLI'],
      meta: 'nelumbo-web-server-<version>.jar' },
    { id: 'mcp', nav: 'MCP server', kind: 'Petal', title: 'MCP server',
      lead: 'Lets an AI assistant write Nelumbo models and check them against the real engine.',
      points: ['eval_nl runs a model and returns structured diagnostics', 'search_docs, get_example and new_model supply the know-how', 'Speaks the Model Context Protocol over stdio'],
      meta: 'nelumbo-mcp-server-<version>.jar' },
    { id: 'editor', nav: 'Nelumbo IDE', kind: 'A bud of its own', title: 'Nelumbo IDE',
      lead: 'A standalone editor that carries its own knowledge base. No server and no plugin, just one jar.',
      points: ['Swing editor with viewers for the syntax tree and the knowledge base', 'Grows from the same core library as everything else'],
      meta: 'nelumbo-ide-<version>.jar' },
    { id: 'full', nav: 'Full bloom', kind: 'Full bloom', title: 'One knowledge base, many ways in',
      lead: 'Every tool is a thin layer around the same core, so a rule behaves the same in the terminal, the editor, the browser and an AI assistant.',
      points: ['Petals: CLI, HTTP, LSP and MCP', 'Leaves: IDE plugins, the web and AI assistants', 'Roots: seven libraries on Java 21'],
      meta: '' }
  ];
  // Components that stay lit while another one is in focus.
  var REL = { libs: ['kb'], http: ['cli'], ide: ['lsp'], web: ['lsp', 'http'], editor: ['kb', 'libs'] };

  var order = STEPS.map(function (s) { return s.id; });
  var last = STEPS.length - 1;
  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('frame'), intro = $('intro'), caption = $('caption'), track = $('track');
  var parts = Array.prototype.map.call(document.querySelectorAll('#scene [data-step]'), function (el) {
    return { el: el, idx: order.indexOf(el.dataset.step) };
  });

  // leaf veins
  Array.prototype.forEach.call(document.querySelectorAll('.veins'), function (g) {
    var rx = +g.dataset.rx - 8, ry = +g.dataset.ry - 5;
    for (var k = 0; k < 12; k++) {
      var a = (k * 30 + 15) * Math.PI / 180;
      var l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x2', (rx * Math.cos(a)).toFixed(1));
      l.setAttribute('y2', (ry * Math.sin(a)).toFixed(1));
      g.appendChild(l);
    }
  });

  // step rail
  var chips = STEPS.map(function (s, n) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip-btn'; b.textContent = s.nav;
    b.addEventListener('click', function () { go(n); });
    track.appendChild(b);
    return b;
  });

  var i = Math.max(0, order.indexOf((location.hash || '').slice(1)));

  function render() {
    var s = STEPS[i];
    frame.classList.toggle('full', i === last);
    parts.forEach(function (p) {
      p.el.classList.toggle('on', i >= p.idx);
      p.el.classList.toggle('cur', i === p.idx);
      p.el.classList.toggle('rel', (REL[s.id] || []).indexOf(p.el.dataset.step) >= 0);
    });
    intro.hidden = i !== 0;
    caption.hidden = i === 0;
    if (i > 0) {
      $('cap-kind').textContent = s.kind;
      $('cap-title').textContent = s.title;
      $('cap-lead').textContent = s.lead;
      var ul = $('cap-points');
      ul.textContent = '';
      s.points.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
      $('cap-meta').textContent = s.meta;
      $('cap-meta').hidden = !s.meta;
      caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in');
    }
    chips.forEach(function (b, n) {
      b.classList.toggle('done', n <= i);
      if (n === i) { b.setAttribute('aria-current', 'step'); if (b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
      else b.removeAttribute('aria-current');
    });
    $('count').textContent = i + ' / ' + last;
    $('prev').disabled = i === 0;
    $('next').disabled = i === last;
    try { history.replaceState(null, '', '#' + s.id); } catch (e) { /* sandboxed viewer */ }
  }
  function go(n) {
    n = Math.max(0, Math.min(last, n));
    if (n !== i) { i = n; render(); }
  }

  $('prev').addEventListener('click', function () { go(i - 1); });
  $('next').addEventListener('click', function () { go(i + 1); });

  // click a piece that is already in the picture to revisit it; click anywhere else to move on
  $('scene').addEventListener('click', function (e) {
    var el = e.target.closest('[data-step]');
    var idx = el && el.classList.contains('on') ? order.indexOf(el.dataset.step) : -1;
    go(idx > 0 && idx !== i ? idx : i + 1);
  });

  function toggleFull() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (root.requestFullscreen) root.requestFullscreen().catch(function () {});
    } catch (e) { /* not available here */ }
  }
  $('full').addEventListener('click', toggleFull);

  // theme: follow the viewer until the presenter picks one
  var KEY = 'nelumbo-overview-theme', hostTheme = root.getAttribute('data-theme');
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
  }
  function setTheme(t) { if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  try { var saved = localStorage.getItem(KEY); if (saved === 'light' || saved === 'dark') setTheme(saved); } catch (e) { setTheme(hostTheme); }
  function toggleTheme() {
    var t = isDark() ? 'light' : 'dark';
    setTheme(t);
    try { localStorage.setItem(KEY, t); } catch (e) { /* storage blocked */ }
  }
  $('theme').addEventListener('click', toggleTheme);

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var onButton = e.target && e.target.closest && e.target.closest('button');
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': go(i + 1); break;
      case ' ': case 'Enter': if (onButton) return; go(i + 1); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': go(i - 1); break;
      case 'Home': go(0); break;
      case 'End': go(last); break;
      case 'f': case 'F': toggleFull(); break;
      case 't': case 'T': toggleTheme(); break;
      default:
        if (/^[0-9]$/.test(e.key)) go(+e.key); else return;
    }
    e.preventDefault();
  });

  render();
  var scroller = document.querySelector('.scroll');
  scroller.scrollLeft = (scroller.scrollWidth - scroller.clientWidth) / 2;
})();
</script>
