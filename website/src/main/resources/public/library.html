<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/theme.js"></script>
<title>Nelumbo Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1d23; --panel: #23262e; --border: #343843;
    --text: #e6e8ee; --prose: #c6cad4; --muted: #9aa0ac; --faint: #5c6270;
    --accent: #c184d8; --accent-soft: #edd4e8;
    --backdrop: rgba(0,0,0,.45); --shadow: rgba(0,0,0,.5);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #fbfafc; --panel: #f2eff5; --border: #e0dbe6;
    --text: #1f1b24; --prose: #3a3542; --muted: #6b6475; --faint: #958e9e;
    --accent: #9246b0; --accent-soft: #74358f;
    --backdrop: rgba(31,27,36,.3); --shadow: rgba(31,27,36,.18);
    color-scheme: light;
  }
  :root { --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 "Instrument Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  footer {
    padding: 6px 16px; border-top: 1px solid var(--border);
    color: var(--faint); font-size: 12px; text-align: right;
  }
  footer a { color: inherit; }
  footer a:hover { color: var(--accent); }
  .site-header { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; border-bottom: 1px solid var(--border); }
  .wordmark { font: 700 14px/1 "Bricolage Grotesque", "Instrument Sans", sans-serif; letter-spacing: .42em; text-transform: uppercase; color: var(--accent-soft); text-decoration: none; }
  .site-header nav { margin-left: auto; white-space: nowrap; display: flex; align-items: center; }
  .site-header nav a { font: 500 13px/1 "Instrument Sans", system-ui, sans-serif; letter-spacing: .08em; color: var(--muted); text-decoration: none; margin-left: 22px; }
  .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; margin-left: 18px; padding: 0; vertical-align: middle; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; }
  .theme-toggle:hover { color: var(--text); }
  .theme-toggle svg { display: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [data-theme-mode="auto"] .theme-toggle .i-auto, [data-theme-mode="light"] .theme-toggle .i-light, [data-theme-mode="dark"] .theme-toggle .i-dark { display: block; }
  .site-header nav a:hover { color: var(--text); }
  .site-header nav a[aria-current="page"] { color: var(--accent); }

  .layout { flex: 1; display: flex; min-height: 0; }
  aside { width: 210px; flex: 0 0 210px; border-right: 1px solid var(--border); padding: 16px 0; overflow: auto; }
  aside nav a { display: block; padding: 5px 16px; color: var(--muted); text-decoration: none; font-size: 13px; }
  aside nav a:hover { color: var(--text); }
  aside nav a.active { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 14px; }
  aside nav details { margin-top: 12px; }
  aside nav details:first-child { margin-top: 0; }
  aside nav .group { display: flex; align-items: center; gap: 8px; padding: 6px 16px; color: var(--text); font: 700 12.5px/1.4 "Bricolage Grotesque", "Instrument Sans", sans-serif; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; list-style: none; user-select: none; }
  aside nav .group::-webkit-details-marker { display: none; }
  aside nav .group::before { content: ""; flex: 0 0 auto; width: 6px; height: 6px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg); transition: transform .15s ease; }
  aside nav details[open] > .group::before { transform: rotate(45deg); }
  aside nav .group:hover { color: var(--accent); }
  aside nav details a { padding-left: 32px; }
  aside nav details a.active { padding-left: 30px; }
  main { flex: 1; display: block; min-height: 0; overflow: auto; padding: 16px; }
  #nav-toggle, #nav-backdrop { display: none; }
  @media (max-width: 760px) {
    #nav-toggle { display: flex; flex: 0 0 auto; width: 36px; height: 36px; flex-direction: column; justify-content: center; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; padding: 0; }
    #nav-toggle span { display: block; width: 18px; height: 2px; background: var(--text); }
    aside { position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; background: var(--bg); transform: translateX(-100%); transition: transform .2s ease; }
    body.nav-open aside { transform: translateX(0); box-shadow: 4px 0 24px var(--shadow); }
    body.nav-open #nav-backdrop { display: block; position: fixed; inset: 0; z-index: 10; background: var(--backdrop); }
  }
  .module-intro { max-width: 780px; margin: 0 0 14px; }
  .module-intro h1 { font: 700 22px/1.2 "Bricolage Grotesque", "Instrument Sans", sans-serif; margin: 0 0 8px; color: var(--text); }
  .module-intro p { color: var(--prose); margin: 0 0 8px; }
  .module-intro code { font: 12.5px var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .module-intro a { color: var(--accent); text-decoration: none; }
  .module-intro a:hover { text-decoration: underline; }
  .module-intro .meta { color: var(--muted); font-size: 13px; }
  .module-intro .meta a { margin-left: 12px; }
  @media (max-width: 600px) {
    .site-header { padding: 0 12px; }
    .wordmark { letter-spacing: .1em; }
    .site-header nav a { margin-left: 10px; font-size: 12px; letter-spacing: 0; }
  }
  /* on narrow phones the GitHub link shrinks to its logo to make room for the theme switch */
  .gh-icon { display: none; width: 16px; height: 16px; fill: currentColor; }
  @media (max-width: 450px) {
    .site-header { gap: 8px; padding: 0 10px; }
    .wordmark { letter-spacing: .04em; }
    .site-header nav a { margin-left: 7px; }
    .gh-label { display: none; }
    .gh-icon { display: block; }
    .theme-toggle { margin-left: 7px; }
  }
  /* the smallest phones: no room for the GitHub link next to the menu button */
  @media (max-width: 380px) {
    .wordmark { font-size: 12px; letter-spacing: 0; }
    .site-header nav a[aria-label="GitHub"] { display: none; }
  }
  @media (max-width: 350px) {
    .site-header { gap: 5px; padding: 0 8px; }
    .site-header nav a { margin-left: 4px; font-size: 11.5px; }
    .theme-toggle { margin-left: 4px; }
  }
</style>
</head>
<body>
<header class="site-header">
  <button id="nav-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
  <a class="wordmark" href="/">Nelumbo</a>
  <nav>
    <a href="/tutorial.html">Tutorial</a>
    <a href="/sandbox.html">Sandbox</a>
    <a href="/library.html" aria-current="page">Library</a>
    <a href="/docs/">Docs</a>
    <a href="https://github.com/ModelingValueGroup/nelumbo" aria-label="GitHub"><svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span class="gh-label">GitHub</span></a>
    <button class="theme-toggle" type="button" aria-label="Theme">
      <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>
<div id="nav-backdrop"></div>

<div class="layout">
<aside>
  <nav id="modules" aria-label="Library modules"></nav>
</aside>
<main>
  <section class="module-intro" aria-live="polite">
    <h1 id="module-name">Standard library</h1>
    <div id="module-text"><p>The modules every Nelumbo program builds on, written in Nelumbo itself. Pick one on the left to read its source; edits are yours to try out and evaluate as you type.</p></div>
    <p class="meta" id="module-meta" hidden><code id="module-import"></code><a id="module-docs" href="/docs/">Reference</a></p>
  </section>
  <div class="nelumbo-field" data-height="60vh" data-no-share></div>
</main>
</div>

<footer><a href="/metadata" target="_blank">metadata</a> · <a href="/health" target="_blank">health</a> · Nelumbo @VERSION@ <span class="status-dot" aria-hidden="true"></span></footer>

<link rel="stylesheet" href="/assets/nelumbo-fields.css">
<script src="/assets/nelumbo-fields.js"></script>
<script>
  (function () {
    var field    = document.querySelector('.nelumbo-field');
    var nav      = document.getElementById('modules');
    var toggle   = document.getElementById('nav-toggle');
    var backdrop = document.getElementById('nav-backdrop');
    function closeNav() { document.body.classList.remove('nav-open'); }
    toggle.addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
    backdrop.addEventListener('click', closeNav);

    var modules = {};
    function show(module) {
      document.getElementById('module-name').textContent = 'nelumbo.' + module.name;
      // the intro is the opening paragraph of the module's reference page, rendered by the server
      document.getElementById('module-text').innerHTML = module.intro;
      document.getElementById('module-import').textContent = 'import nelumbo.' + module.name;
      document.getElementById('module-docs').href = module.docs;
      document.getElementById('module-meta').hidden = false;
    }
    // replaces the document (one undoable edit) and marks the module as current
    function load(name, setHash) {
      fetch('/library/' + encodeURIComponent(name)).then(function (r) { return r.ok ? r.text() : null; }).then(function (source) {
        if (source === null || !NelumboFields.setFieldText(field, source, name)) { return; }
        show(modules[name]);
        nav.querySelectorAll('a').forEach(function (a) {
          var active = a.dataset.module === name;
          a.classList.toggle('active', active);
          // a module opened by a #name link must not hide in a collapsed group
          if (active) { a.parentElement.open = true; }
        });
        if (setHash && location.hash !== '#' + name) { history.replaceState(null, '', '#' + name); }
      });
    }

    NelumboFields.initNelumboFields();
    fetch('/library').then(function (r) { return r.json(); }).then(function (body) {
      var group   = null;
      var details = null;
      body.modules.forEach(function (m) {
        modules[m.name] = m;
        if (m.group !== group) {
          group = m.group;
          details = document.createElement('details');
          details.open = true;
          var summary = document.createElement('summary');
          summary.className = 'group';
          summary.textContent = group;
          details.appendChild(summary);
          nav.appendChild(details);
        }
        var a = document.createElement('a');
        a.href = '#' + m.name;
        a.dataset.module = m.name;
        a.textContent = m.name;
        details.appendChild(a);
      });
      nav.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-module]');
        if (!a) { return; }
        e.preventDefault();
        load(a.dataset.module, true);
        closeNav();
      });
      window.addEventListener('hashchange', function () {
        var name = location.hash.slice(1);
        if (modules[name]) { load(name, true); }
      });
      var initial = location.hash.slice(1);
      if (modules[initial]) { load(initial, true); } else if (body.modules.length) { load(body.modules[0].name, false); }
    });
  })();
</script>
<script src="/status-dot.js" defer></script>
</body>
</html>
