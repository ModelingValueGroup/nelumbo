<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>@TITLE@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #1b1d23; color: #e6e8ee; font: 15px/1.6 "Instrument Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; }
  aside { width: 260px; flex: 0 0 260px; border-right: 1px solid #343843; padding: 16px 0; overflow: auto; }
  aside h1 { font: 700 15px/1.3 "Bricolage Grotesque", "Instrument Sans", sans-serif; margin: 0 16px 14px; }
  aside h1 a { color: inherit; text-decoration: none; }
  aside nav a { display: block; padding: 5px 16px; color: #9aa0ac; text-decoration: none; font-size: 13px; line-height: 1.4; }
  aside nav a:hover { color: #e6e8ee; }
  aside nav a.active { color: #c184d8; border-left: 2px solid #c184d8; padding-left: 14px; }
  aside nav .group { padding: 14px 16px 4px; color: #5c6270; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  aside nav .version { display: block; padding: 6px 16px; color: #5c6270; font-size: 12px; }
  aside .sep { border-top: 1px solid #343843; margin: 12px 0; }
  main { flex: 1; overflow: auto; }
  article { max-width: 860px; margin: 0 auto; padding: 24px 32px 80px; }
  article h1, article h2, article h3, article h4 { font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif; font-weight: 700; line-height: 1.3; }
  article h1 { font-size: 30px; margin: 8px 0 20px; }
  article h2 { font-size: 22px; margin: 40px 0 12px; padding-top: 16px; border-top: 1px solid #343843; }
  article h3 { font-size: 17px; margin: 28px 0 8px; }
  article h4 { font-size: 15px; margin: 20px 0 6px; color: #c6cad4; }
  article p, article li { color: #c6cad4; }
  article a { color: #c184d8; }
  article a:hover { color: #edd4e8; }
  article strong { color: #e6e8ee; }
  article code { background: #23262e; border-radius: 4px; padding: 1px 5px; font: 13px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  article pre { background: #23262e; border: 1px solid #343843; border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
  article pre code { background: none; padding: 0; }
  article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid #c184d8; color: #9aa0ac; }
  article blockquote p { margin: 8px 0; }
  article hr { border: 0; border-top: 1px solid #343843; margin: 32px 0; }
  article table { border-collapse: collapse; margin: 16px 0; font-size: 14px; display: block; max-width: 100%; overflow-x: auto; }
  article th, article td { border: 1px solid #343843; padding: 6px 12px; text-align: left; vertical-align: top; }
  article th { background: #23262e; color: #e6e8ee; }
  article td { color: #c6cad4; }
  article img { max-width: 100%; }
  article ul, article ol { padding-left: 24px; }
  article li { margin: 4px 0; }
  #nav-toggle, #nav-backdrop { display: none; }
  @media (max-width: 760px) {
    #nav-toggle { display: flex; position: fixed; top: 10px; left: 10px; z-index: 30; width: 40px; height: 40px; flex-direction: column; justify-content: center; align-items: center; gap: 4px; background: #23262e; border: 1px solid #343843; border-radius: 8px; cursor: pointer; padding: 0; }
    #nav-toggle span { display: block; width: 18px; height: 2px; background: #e6e8ee; }
    aside { position: fixed; top: 0; left: 0; bottom: 0; z-index: 20; background: #1b1d23; transform: translateX(-100%); transition: transform .2s ease; }
    body.nav-open aside { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.5); }
    body.nav-open #nav-backdrop { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); }
    aside h1 { margin-left: 60px; line-height: 40px; margin-top: -6px; }
    article { padding: 60px 16px 80px; }
  }
</style>
</head>
<body>
<button id="nav-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
<div id="nav-backdrop"></div>
<aside>
  <h1><a href="/docs/">Nelumbo docs</a></h1>
  <nav>
@NAV@
    <div class="sep"></div>
    <a href="/">&lt;- Home</a>
    <a href="/tour.html">Tour -&gt;</a>
    <a href="/playground.html">Playground -&gt;</a>
    <div class="sep"></div>
    <span class="version">@VERSION@</span>
  </nav>
</aside>
<main>
  <article>
@CONTENT@
  </article>
</main>
<script>
  (function () {
    var toggle = document.getElementById('nav-toggle');
    var backdrop = document.getElementById('nav-backdrop');
    toggle.addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
    backdrop.addEventListener('click', function () { document.body.classList.remove('nav-open'); });
    var active = document.querySelector('aside nav a.active');
    if (active) { active.scrollIntoView({ block: 'center' }); }
  })();
</script>
</body>
</html>
